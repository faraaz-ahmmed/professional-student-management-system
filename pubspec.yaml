
name: psms
description: "Professional Student Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/psms_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/psms_icon.png"
  min_sdk_android: 21
